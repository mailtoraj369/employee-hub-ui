spring:
  application:
    name: employee-hub-ui
  profiles:
    active: dev

employee:
  hub:
    service:
      base-url: http://localhost:9090

logging:
  level:
    root: INFO
    com.acme.employeehub.ui: DEBUG
    org.springframework.web.client: DEBUG
    org.springframework.web: INFO

management:
  endpoints:
    web:
      base-path: /api/actuator
      exposure:
        include: health,metrics,prometheus
  endpoint:
    health:
      show-details: always
